name: Publish portfolio
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add site files
        run: |
          if [ ! -f index.html ]; then
            curl -fsSL -o index.html "https://litter.catbox.moe/wbqc2z.html"
            curl -fsSL -o visual-effects.js "https://h.uguu.se/wewYvbqg.js"
            curl -fsSL -o portrait.png "https://n.uguu.se/vqeRSBOb.png"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html visual-effects.js portrait.png
            git commit -m "Add portfolio site files"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
